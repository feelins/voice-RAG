  <rect x="140" y="140" width="25" height="40" rx="3" fill="#f4e8d0" stroke="#8b4513" stroke-width="1.5"/>
  <line x1="145" y1="150" x2="160" y2="150" stroke="#654321" stroke-width="0.5"/>
  <line x1="145" y1="155" x2="160" y2="155" stroke="#654321" stroke-width="0.5"/>
  <line x1="145" y1="160" x2="160" y2="160" stroke="#654321" stroke-width="0.5"/>
  <line x1="145" y1="165" x2="160" y2="165" stroke="#654321" stroke-width="0.5"/>
